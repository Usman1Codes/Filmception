services:
  - type: web
    name: filmception
    env: docker
    plan: free
    autoDeploy: true
    # If using Render registries, omit Dockerfile; otherwise this uses the Dockerfile in repo root
    buildCommand: docker build -t filmception .
    startCommand: streamlit run filmception_gui.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: FILMCEPTION_TRANSLATION_DIR
        value: /app/translation
      - key: FILMCEPTION_AUDIO_DIR
        value: /app/audio
      - key: FILMCEPTION_MODEL_DIR
        value: /app/model
      - key: HF_HOME
        value: /cache/huggingface
      - key: TRANSFORMERS_CACHE
        value: /cache/huggingface
      - key: TORCH_HOME
        value: /cache/torch
      - key: XDG_CACHE_HOME
        value: /cache
      - key: STREAMLIT_SERVER_HEADLESS
        value: 'true'
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: 'false' 